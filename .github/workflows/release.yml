name: Developer preview downloads
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    if: github.event_name == 'release' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check analyzer behavior before release
        run: php tests/run.php
      - name: Resolve release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python -c 'import json; print(json.load(open("project.json"))["version"])')"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Verify release version
        run: python -c 'import json, os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("project.json"))["version"]'
      - name: Build publication archives
        run: python tools/package.py
      - name: Create the verified version tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
      - name: Create a prerelease for the tag
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes
      - name: Attach plugin and source downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
