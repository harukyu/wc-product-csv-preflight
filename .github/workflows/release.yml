name: Developer preview downloads
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c 'import json, os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("project.json"))["version"]'
      - name: Build publication archives
        run: python tools/package.py
      - name: Attach plugin and source downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
